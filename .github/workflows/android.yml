name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # Checkout source code
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Install Rust
      # ------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ------------------------------------------
      # Install Trunk
      # ------------------------------------------
      - name: Install Trunk
        run: |
          curl -L \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/trunk.tar.gz

          tar -xzf /tmp/trunk.tar.gz -C /tmp

          chmod +x /tmp/trunk

          mv /tmp/trunk "$HOME/.cargo/bin/trunk"

      # ------------------------------------------
      # Build Yew application
      # ------------------------------------------
      - name: Build Yew application
        run: |
          trunk build --release

      # ------------------------------------------
      # Setup Node.js
      # ------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ------------------------------------------
      # Remove any accidental root npm files
      # ------------------------------------------
      - name: Clean root npm files
        run: |
          rm -f package.json
          rm -f package-lock.json
          rm -rf node_modules

      # ------------------------------------------
      # Create temporary Capacitor workspace
      # ------------------------------------------
      - name: Create Capacitor workspace
        run: |
          rm -rf capacitor

          mkdir -p capacitor

          cd capacitor

          npm init -y

      # ------------------------------------------
      # Install Capacitor dependencies
      # ------------------------------------------
      - name: Install Capacitor dependencies
        run: |
          cd capacitor

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/camera \
            esbuild

      # ------------------------------------------
      # Verify npm installation
      # ------------------------------------------
      - name: Verify Node environment
        run: |
          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Capacitor package:"
          cat capacitor/package.json

          echo ""
          echo "esbuild:"
          ./capacitor/node_modules/.bin/esbuild --version

      # ------------------------------------------
      # Initialize Capacitor
      # ------------------------------------------
      - name: Initialize Capacitor
        run: |
          cd capacitor

          npx cap init \
            "Find My Stuff" \
            "com.example.findmystuff" \
            --web-dir ../dist

      # ------------------------------------------
      # Create Camera bridge
      # ------------------------------------------
      - name: Create Camera bridge
        run: |
          mkdir -p "$GITHUB_WORKSPACE/capacitor/bridge"

          cat > "$GITHUB_WORKSPACE/capacitor/bridge/camera-bridge.js" <<'EOF'
          import {
            Camera,
            CameraResultType,
            CameraSource
          } from '@capacitor/camera';

          window.Capacitor = window.Capacitor || {};
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};

          window.Capacitor.Plugins.Camera = {

            async getPhoto(options = {}) {

              const photo = await Camera.getPhoto({
                quality: options.quality ?? 90,

                allowEditing:
                  options.allowEditing ?? false,

                resultType:
                  CameraResultType.DataUrl,

                source:
                  options.source === "camera"
                    ? CameraSource.Camera
                    : CameraSource.Prompt
              });

              return {
                dataUrl: photo.dataUrl
              };
            }
          };
          EOF

      # ------------------------------------------
      # Verify bridge source
      # ------------------------------------------
      - name: Verify Camera bridge source
        run: |
          echo "Bridge location:"
          ls -lah "$GITHUB_WORKSPACE/capacitor/bridge/"

          echo ""
          echo "Bridge contents:"
          cat "$GITHUB_WORKSPACE/capacitor/bridge/camera-bridge.js"

      # ------------------------------------------
      # Bundle Camera bridge
      # ------------------------------------------
      - name: Bundle Camera bridge
        run: |
          ESBUILD="$GITHUB_WORKSPACE/capacitor/node_modules/.bin/esbuild"

          INPUT="$GITHUB_WORKSPACE/capacitor/bridge/camera-bridge.js"

          OUTPUT="$GITHUB_WORKSPACE/dist/capacitor-camera.js"

          echo "esbuild = $ESBUILD"
          echo "input   = $INPUT"
          echo "output  = $OUTPUT"

          test -f "$INPUT"
          test -x "$ESBUILD"

          "$ESBUILD" \
            "$INPUT" \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile="$OUTPUT"

      # ------------------------------------------
      # Verify generated JS
      # ------------------------------------------
      - name: Verify Camera bundle
        run: |
          echo "Generated bundle:"
          ls -lh "$GITHUB_WORKSPACE/dist/capacitor-camera.js"

          echo ""
          echo "First 20 lines:"
          head -n 20 "$GITHUB_WORKSPACE/dist/capacitor-camera.js"

      # ------------------------------------------
      # Inject Camera bridge into Yew HTML
      # ------------------------------------------
      - name: Inject Camera bridge
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("dist/index.html")

          if not path.exists():
              raise SystemExit("ERROR: dist/index.html does not exist")

          html = path.read_text()

          script = '<script src="capacitor-camera.js"></script>'

          if "capacitor-camera.js" not in html:

              if "</body>" in html:
                  html = html.replace(
                      "</body>",
                      script + "\n</body>"
                  )
              else:
                  html += "\n" + script

          path.write_text(html)

          print("Camera bridge injected.")

          PY

      # ------------------------------------------
      # Verify HTML
      # ------------------------------------------
      - name: Verify final web assets
        run: |
          echo "dist:"
          ls -lah dist/

          echo ""
          echo "Camera bridge reference:"
          grep -n "capacitor-camera.js" dist/index.html || true

      # ------------------------------------------
      # Generate Android project
      # ------------------------------------------
      - name: Add Android platform
        run: |
          cd capacitor

          npx cap add android

      # ------------------------------------------
      # Sync Capacitor
      # ------------------------------------------
      - name: Sync Capacitor
        run: |
          cd capacitor

          npx cap sync android

      # ------------------------------------------
      # Setup Java
      # ------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ------------------------------------------
      # Setup Android SDK
      # ------------------------------------------
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | head -n 1)

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # ------------------------------------------
      # Build APK
      # ------------------------------------------
      - name: Build debug APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug

      # ------------------------------------------
      # Upload APK
      # ------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: find-my-stuff-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
